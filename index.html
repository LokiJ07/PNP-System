<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="../image/pnplogo.png">

<title>PNP | User Dashboard</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>

#map{
height:400px;
width:100%;
border-radius:12px;
}

.location-marker{
background:#1f6fb2;
border:3px solid white;
border-radius:50%;
width:20px;
height:20px;
}

.user-location-marker{
background:#22c55e;
border:3px solid white;
border-radius:50%;
width:20px;
height:20px;
animation:pulse 2s infinite;
}

@keyframes pulse{
0%{box-shadow:0 0 0 0 rgba(34,197,94,0.7);}
70%{box-shadow:0 0 0 10px rgba(34,197,94,0);}
100%{box-shadow:0 0 0 0 rgba(34,197,94,0);}
}

</style>
</head>

<body class="flex flex-col md:flex-row bg-[#0a3d62] min-h-screen">

<div class="w-full md:w-[240px] bg-[#08324f] text-white p-5">

<div class="flex items-center gap-3 mb-6">
<img src="../image/pnplogo.png" class="w-10">
<h2 class="text-xl font-semibold">PNP User</h2>
</div>

<ul class="space-y-2">

<li class="p-3 rounded bg-[#0a3d62]">
<a href="user_dashboard.html">
<i class="fas fa-tachometer-alt mr-2"></i>Dashboard
</a>
</li>

<li class="p-3 rounded bg-red-600">
<a href="../index.html">
<i class="fas fa-sign-out-alt mr-2"></i>Logout
</a>
</li>

</ul>

</div>


<div class="flex-1 p-6 bg-[#eef2f6]">

<h2 class="text-2xl font-bold text-[#08324f] mb-4">
User Dashboard
</h2>


<div class="bg-white p-5 rounded-lg shadow mb-6">

<h3 class="font-semibold mb-3">
Select Location
</h3>

<div class="flex gap-3 mb-3">

<button onclick="getUserLocation()" class="bg-[#1f6fb2] text-white px-4 py-2 rounded">
My Location
</button>

<button onclick="resetMapView()" class="bg-yellow-500 text-white px-4 py-2 rounded">
Reset
</button>

</div>

<div id="map"></div>

</div>


<div class="bg-white p-5 rounded-lg shadow">

<h3 class="font-semibold mb-4">
Report New Activity
</h3>

<form onsubmit="submitActivity(event)">

<input type="hidden" id="selectedLat">
<input type="hidden" id="selectedLng">

<div class="grid md:grid-cols-2 gap-4">

<div>

<label class="text-sm">Activity Type</label>

<select id="activityType" class="w-full border p-2 rounded">

<option value="">Select Type</option>
<option value="foot_patrol">Foot Patrol</option>
<option value="mobile_patrol">Mobile Patrol</option>
<option value="motor_patrol">Motor Patrol</option>
<option value="checkpoint">Checkpoint</option>
<option value="oplan_bakal">Oplan Bakal</option>
<option value="oplan_sita">Oplan Sita</option>

</select>

</div>

<div>

<label class="text-sm">Location</label>

<input type="text" id="specificLocation" readonly
class="w-full border p-2 rounded">

</div>

<div>

<label class="text-sm">Date</label>

<input type="date" id="dateInput" class="w-full border p-2 rounded">

</div>

<div>

<label class="text-sm">Time</label>

<input type="time" id="timeInput" class="w-full border p-2 rounded">

</div>

</div>


<div class="mt-4">

<label class="text-sm">Accomplishment</label>

<textarea id="accomplishment" rows="4"
class="w-full border p-2 rounded"></textarea>

</div>

<div class="mt-4">

<label class="text-sm">Photo Evidence</label>

<input type="file" accept="image/*"
class="w-full border p-2 rounded">

</div>

<button class="mt-5 w-full bg-[#1f6fb2] text-white py-3 rounded">

Submit Activity Report

</button>

</form>

</div>

</div>



<script>

let map
let marker
let userMarker

function initMap(){

map = L.map('map').setView([8.3782,124.8658],12)

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
).addTo(map)

map.on('click',function(e){

placeMarker(e.lat,e.lng)

})

}

function placeMarker(lat,lng){

if(marker){

marker.setLatLng([lat,lng])

}else{

marker = L.marker([lat,lng]).addTo(map)

}

document.getElementById("selectedLat").value = lat
document.getElementById("selectedLng").value = lng

reverseGeocode(lat,lng)

}

function reverseGeocode(lat,lng){

fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`)

.then(res=>res.json())

.then(data=>{

document.getElementById("specificLocation").value =
data.display_name

})

}

function getUserLocation(){

navigator.geolocation.getCurrentPosition(function(position){

const lat = position.coords.latitude
const lng = position.coords.longitude

map.setView([lat,lng],17)

placeMarker(lat,lng)

})

}

function resetMapView(){

map.setView([8.3782,124.8658],12)

if(marker){
map.removeLayer(marker)
marker=null
}

document.getElementById("specificLocation").value=""

}

function submitActivity(e){

e.preventDefault()

if(!document.getElementById("selectedLat").value){

alert("Select location on map")

return

}

alert("Activity submitted")

e.target.reset()

setPhilippineTime()

resetMapView()

}



function setPhilippineTime(){

const now = new Date()

const utc = now.getTime() + (now.getTimezoneOffset()*60000)

const ph = new Date(utc + (3600000*8))

const year = ph.getFullYear()
const month = String(ph.getMonth()+1).padStart(2,'0')
const day = String(ph.getDate()).padStart(2,'0')

const hours = String(ph.getHours()).padStart(2,'0')
const minutes = String(ph.getMinutes()).padStart(2,'0')

document.getElementById("dateInput").value =
year+"-"+month+"-"+day

document.getElementById("timeInput").value =
hours+":"+minutes

}

document.addEventListener("DOMContentLoaded",function(){

initMap()

setPhilippineTime()

})

</script>

</body>
</html>
